# Test database configuration for Jenkins CI/CD environment
spring.datasource.url=jdbc:postgresql://localhost:5432/db11
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Server configuration
server.port=8088

# JWT Configuration
demo.app.jwtCookieName=cnc-cookies
demo.app.jwtSecret=replace_with_test_jwt_secret
demo.app.jwtExpirationMs=86400000
demo.app.jwtRefreshExpirationMs=86400000

# Email Configuration (using test mode for integration tests)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_test_email@example.com
spring.mail.password=replace_with_test_mail_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.admin.notification-emails=admin1@example.com,admin2@example.com

# AWS S3 Configuration
aws.accessKeyId=testAccessKey
aws.secretAccessKey=testSecretKey
aws.region=us-east-1
aws.bucketName=test-bucket

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Pagination settings
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
